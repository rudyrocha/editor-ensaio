name: Testes de regressao
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Testes unitarios sem arquivos reais
        run: python -m unittest discover -s tests -v
